[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "aiopprpc"
description = "An asynchronous Python library for local control of PPRPC (XC Things / FtyCam) cameras."
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "LN"}
]
requires-python = ">=3.10"
keywords = ["pprpc", "ft04", "camera", "async", "video", "streaming", "mjpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "aiohttp",
    "pycryptodome",
]

[tool.setuptools.packages.find]
include = ["aiopprpc*"]

[tool.setuptools.dynamic]
version = {attr = "aiopprpc.__version__.__version__"}

[project.urls]
"Homepage" = "https://github.com/DevLn/aiopprpc"
"Bug Tracker" = "https://github.com/DevLn/aiopprpc/issues"
"Source" = "https://github.com/DevLn/aiopprpc"
